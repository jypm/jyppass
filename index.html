<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#000000">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="icon" href="favicon.png" type="image/png" sizes="64x64">
  <title>JYP 비밀번호 관리</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      height: 100%;
      overflow: hidden;
      overscroll-behavior-y: contain;
    }
    body {
      background: #000; color: #ccc; font-family: 'Segoe UI', sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }

    #login-screen {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; height: 100vh; gap: 16px;
    }
    #login-screen h1 { font-size: 22px; color: #888; margin-bottom: 8px; }
    #login-screen input {
      padding: 12px 16px; border-radius: 10px; border: 1px solid #333;
      background: #111; color: #ccc; font-size: 16px; width: 240px;
      user-select: text; -webkit-user-select: text;
    }
    #login-screen input[type="password"] { letter-spacing: 6px; }
    .save-row {
      display: flex; align-items: center; gap: 8px;
      color: #666; font-size: 13px; width: 240px;
    }
    .save-row input { width: auto; }
    #login-screen button {
      padding: 12px 40px; border-radius: 10px; border: 1px solid #333;
      background: #111; color: #aaa; font-size: 16px; cursor: pointer; width: 240px;
    }

    #main-screen {
      display: none; padding: 20px; max-width: 700px; margin: 0 auto;
      overflow-y: auto; height: 100vh;
    }
    .header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 20px;
    }
    .header h2 { color: #aaa; }
    .header-right { display: flex; align-items: center; gap: 12px; }
    #timer { font-size: 12px; color: #555; }
    .header button {
      padding: 8px 16px; border-radius: 8px; border: 1px solid #333;
      background: #111; color: #888; cursor: pointer;
    }

    .add-btn {
      width: 100%; padding: 14px; border-radius: 10px; border: 1px solid #333;
      background: #111; color: #aaa; font-size: 16px;
      cursor: pointer; margin-bottom: 20px;
    }

    .card {
      background: #111; border-radius: 10px; padding: 16px;
      margin-bottom: 12px; display: flex; justify-content: space-between;
      align-items: center; border: 1px solid #222;
      cursor: grab; transition: opacity 0.2s;
    }
    .card.dragging { opacity: 0.4; cursor: grabbing; }
    .card.drag-over { border-color: #555; }
    .card-info h3 { font-size: 16px; margin-bottom: 4px; color: #ccc; }
    .card-info p { font-size: 13px; color: #666; }
    .card-left { display: flex; align-items: center; gap: 12px; }
    .drag-handle { color: #444; font-size: 18px; cursor: grab; }
    .card-actions { display: flex; gap: 8px; }
    .card-actions button {
      padding: 6px 12px; border-radius: 8px; border: none;
      cursor: pointer; font-size: 13px;
    }
    .btn-show { background: #1a3a5c; color: #aaa; }
    .btn-edit { background: #3a2a00; color: #aaa; }
    .btn-del { background: #3a0000; color: #aaa; }

    .modal {
      display: none; position: fixed; top: 0; left: 0;
      width: 100%; height: 100%; background: rgba(0,0,0,0.9);
      justify-content: center; align-items: center;
      z-index: 100;
    }
    .modal.show { display: flex; }
    .modal-box {
      background: #111; border-radius: 14px; padding: 24px;
      width: 320px; display: flex; flex-direction: column; gap: 12px;
      border: 1px solid #222;
    }
    .modal-box h3 { color: #888; margin-bottom: 4px; }
    .modal-box input {
      padding: 10px; border-radius: 8px; border: 1px solid #333;
      background: #000; color: #ccc; font-size: 14px; width: 100%;
      user-select: text; -webkit-user-select: text;
    }
    .modal-box button {
      padding: 10px; border-radius: 8px; border: none;
      cursor: pointer; font-size: 14px; color: #aaa;
    }
    .btn-save { background: #222; }
    .btn-cancel { background: #1a1a1a; }

    .masked {
      font-size: 16px; margin-bottom: 8px; cursor: pointer;
      padding: 8px; border-radius: 8px; background: #0a0a0a;
      border: 1px solid #222; color: #aaa;
      user-select: none; -webkit-user-select: none;
    }
    .masked .hint { font-size: 11px; color: #444; margin-top: 4px; }
  </style>
</head>
<body>

<div id="login-screen">
  <h1>🔐 비밀번호 관리</h1>
  <input type="text" id="name-input" placeholder="이름 입력">
  <input type="password" id="pin-input" placeholder="PIN">
  <div class="save-row">
    <input type="checkbox" id="save-id">
    <label for="save-id">아이디 저장</label>
  </div>
  <button onclick="doLogin()">로그인</button>
</div>

<div id="main-screen">
  <div class="header">
    <h2 id="welcome-text"></h2>
    <div class="header-right">
      <span id="timer"></span>
      <button onclick="doLogout()">로그아웃</button>
    </div>
  </div>
  <button class="add-btn" onclick="openAddModal()">+ 계정 추가</button>
  <div id="list"></div>
</div>

<div class="modal" id="modal">
  <div class="modal-box">
    <h3 id="modal-title">계정 추가</h3>
    <input type="text" id="m-service" placeholder="서비스명 (예: 네이버)">
    <input type="text" id="m-id" placeholder="아이디">
    <input type="text" id="m-pw" placeholder="비밀번호">
    <input type="text" id="m-memo" placeholder="메모 (선택)">
    <button class="btn-save" onclick="saveEntry()">저장</button>
    <button class="btn-cancel" onclick="closeModal()">취소</button>
  </div>
</div>

<div class="modal" id="view-modal">
  <div class="modal-box">
    <h3 id="v-service"></h3>
    <p style="color:#666;font-size:12px">아이디</p>
    <div class="masked" id="v-id-wrap">
      <div id="v-id"></div>
      <div class="hint">꾹 누르면 표시</div>
    </div>
    <p style="color:#666;font-size:12px">비밀번호</p>
    <div class="masked" id="v-pw-wrap">
      <div id="v-pw"></div>
      <div class="hint">꾹 누르면 표시</div>
    </div>
    <p style="color:#666;font-size:12px">메모</p>
    <p id="v-memo" style="font-size:14px;margin-bottom:12px"></p>
    <button class="btn-cancel" onclick="closeViewModal()">닫기</button>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
  import { getFirestore, collection, doc, getDocs, addDoc, updateDoc, deleteDoc, query, where } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDWu9mmACrAqv3P-VW54DogZ61ZzraW5Yg",
    authDomain: "jyppass.firebaseapp.com",
    projectId: "jyppass",
    storageBucket: "jyppass.firebasestorage.app",
    messagingSenderId: "270444457037",
    appId: "1:270444457037:web:93a53b15668c2784188004"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  let currentUser = null;
  let editingId = null;
  let timerInterval = null;
  let dragSrcEl = null;
  let realId = '';
  let realPw = '';
  const TIMEOUT = 5 * 60;

  function mask(str) {
    if (!str) return '';
    if (str.length <= 3) return str[0] + '*'.repeat(str.length - 1);
    return str.slice(0, 2) + '*'.repeat(str.length - 3) + str.slice(-1);
  }

  function setupReveal(elId, wrapId, getRealVal) {
    const wrap = document.getElementById(wrapId);
    const el = document.getElementById(elId);
    const show = () => { el.textContent = getRealVal(); };
    const hide = () => { el.textContent = mask(getRealVal()); };
    wrap.addEventListener('mousedown', show);
    wrap.addEventListener('mouseup', hide);
    wrap.addEventListener('mouseleave', hide);
    wrap.addEventListener('touchstart', e => { e.preventDefault(); show(); }, { passive: false });
    wrap.addEventListener('touchend', hide);
    wrap.addEventListener('touchcancel', hide);
  }

  setupReveal('v-id', 'v-id-wrap', () => realId);
  setupReveal('v-pw', 'v-pw-wrap', () => realPw);

  document.addEventListener('contextmenu', e => e.preventDefault());

  history.pushState(null, null, location.href);
  window.addEventListener('popstate', () => {
    history.pushState(null, null, location.href);
  });

  const savedName = localStorage.getItem('savedName');
  if (savedName) {
    document.getElementById('name-input').value = savedName;
    document.getElementById('save-id').checked = true;
  }

  function startTimer() {
    let remaining = TIMEOUT;
    clearInterval(timerInterval);
    timerInterval = setInterval(() => {
      remaining--;
      const m = Math.floor(remaining / 60);
      const s = remaining % 60;
      document.getElementById('timer').textContent = `${m}:${s.toString().padStart(2,'0')}`;
      if (remaining <= 0) { clearInterval(timerInterval); doLogout(); }
    }, 1000);
  }

  function resetTimer() {
    if (!currentUser) return;
    startTimer();
  }

  ['click','keydown','mousemove','touchstart'].forEach(e => {
    document.addEventListener(e, resetTimer);
  });

  window.doLogin = async function() {
    const name = document.getElementById('name-input').value.trim();
    const pin = document.getElementById('pin-input').value.trim();
    const saveId = document.getElementById('save-id').checked;
    if (!name || !pin) return alert('이름과 PIN을 입력하세요');
    const snap = await getDocs(query(collection(db, 'users'), where('name', '==', name)));
    if (snap.empty) return alert('사용자 없음');
    const userDoc = snap.docs[0];
    const user = userDoc.data();
    if (user.pin !== pin) return alert('PIN 오류');
    if (saveId) localStorage.setItem('savedName', name);
    else localStorage.removeItem('savedName');
    currentUser = { id: userDoc.id, ...user };
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('main-screen').style.display = 'block';
    document.getElementById('welcome-text').textContent = name + '님';
    document.getElementById('pin-input').value = '';
    startTimer();
    loadList();
  }

  window.doLogout = function() {
    currentUser = null;
    clearInterval(timerInterval);
    document.getElementById('timer').textContent = '';
    document.getElementById('login-screen').style.display = 'flex';
    document.getElementById('main-screen').style.display = 'none';
    document.getElementById('pin-input').value = '';
  }

  async function loadList() {
    const listEl = document.getElementById('list');
    listEl.innerHTML = '';
    const q = query(collection(db, 'passwords'), where('uid', '==', currentUser.id));
    const snap = await getDocs(q);

    const savedOrder = JSON.parse(localStorage.getItem('order_' + currentUser.id) || '[]');
    let docs = snap.docs.map(d => ({ id: d.id, ...d.data() }));

    if (savedOrder.length > 0) {
      docs.sort((a, b) => {
        const ai = savedOrder.indexOf(a.id);
        const bi = savedOrder.indexOf(b.id);
        return (ai === -1 ? 999 : ai) - (bi === -1 ? 999 : bi);
      });
    }

    docs.forEach(data => {
      const card = document.createElement('div');
      card.className = 'card';
      card.setAttribute('data-id', data.id);
      card.draggable = true;
      card.innerHTML = `
        <div class="card-left">
          <span class="drag-handle">⠿</span>
          <div class="card-info">
            <h3>${data.service}</h3>
            <p>${data.id}</p>
          </div>
        </div>
        <div class="card-actions">
          <button class="btn-show" onclick="viewEntry('${data.id}','${data.service}','${data.id}','${data.pw}','${data.memo||''}')">보기</button>
          <button class="btn-edit" onclick="openEditModal('${data.id}','${data.service}','${data.id}','${data.pw}','${data.memo||''}')">수정</button>
          <button class="btn-del" onclick="delEntry('${data.id}')">삭제</button>
        </div>
      `;

      card.addEventListener('dragstart', e => {
        dragSrcEl = card;
        card.classList.add('dragging');
        e.dataTransfer.effectAllowed = 'move';
      });
      card.addEventListener('dragend', () => {
        card.classList.remove('dragging');
        document.querySelectorAll('.card').forEach(c => c.classList.remove('drag-over'));
        saveOrder();
      });
      card.addEventListener('dragover', e => {
        e.preventDefault();
        if (card !== dragSrcEl) card.classList.add('drag-over');
      });
      card.addEventListener('dragleave', () => card.classList.remove('drag-over'));
      card.addEventListener('drop', e => {
        e.preventDefault();
        if (dragSrcEl !== card) {
          const allCards = [...listEl.querySelectorAll('.card')];
          const srcIdx = allCards.indexOf(dragSrcEl);
          const dstIdx = allCards.indexOf(card);
          if (srcIdx < dstIdx) listEl.insertBefore(dragSrcEl, card.nextSibling);
          else listEl.insertBefore(dragSrcEl, card);
        }
      });

      card.addEventListener('touchstart', e => {
        dragSrcEl = card;
      }, { passive: true });
      card.addEventListener('touchmove', e => {
        e.preventDefault();
        const touch = e.touches[0];
        const target = document.elementFromPoint(touch.clientX, touch.clientY);
        const targetCard = target?.closest('.card');
        if (targetCard && targetCard !== dragSrcEl) {
          const allCards = [...listEl.querySelectorAll('.card')];
          const srcIdx = allCards.indexOf(dragSrcEl);
          const dstIdx = allCards.indexOf(targetCard);
          if (srcIdx < dstIdx) listEl.insertBefore(dragSrcEl, targetCard.nextSibling);
          else listEl.insertBefore(dragSrcEl, targetCard);
        }
      }, { passive: false });
      card.addEventListener('touchend', () => saveOrder());

      listEl.appendChild(card);
    });
  }

  function saveOrder() {
    const cards = [...document.querySelectorAll('.card')];
    const order = cards.map(c => c.getAttribute('data-id'));
    localStorage.setItem('order_' + currentUser.id, JSON.stringify(order));
  }

  window.openAddModal = function() {
    editingId = null;
    document.getElementById('modal-title').textContent = '계정 추가';
    document.getElementById('m-service').value = '';
    document.getElementById('m-id').value = '';
    document.getElementById('m-pw').value = '';
    document.getElementById('m-memo').value = '';
    document.getElementById('modal').classList.add('show');
  }

  window.openEditModal = function(id, service, uid, pw, memo) {
    editingId = id;
    document.getElementById('modal-title').textContent = '계정 수정';
    document.getElementById('m-service').value = service;
    document.getElementById('m-id').value = uid;
    document.getElementById('m-pw').value = pw;
    document.getElementById('m-memo').value = memo;
    document.getElementById('modal').classList.add('show');
  }

  window.closeModal = function() {
    document.getElementById('modal').classList.remove('show');
  }

  window.saveEntry = async function() {
    const service = document.getElementById('m-service').value.trim();
    const id = document.getElementById('m-id').value.trim();
    const pw = document.getElementById('m-pw').value.trim();
    const memo = document.getElementById('m-memo').value.trim();
    if (!service || !id || !pw) return alert('서비스명, 아이디, 비밀번호는 필수입니다');
    if (editingId) {
      await updateDoc(doc(db, 'passwords', editingId), { service, id, pw, memo });
    } else {
      await addDoc(collection(db, 'passwords'), { uid: currentUser.id, service, id, pw, memo });
    }
    closeModal();
    loadList();
  }

  window.delEntry = async function(id) {
    if (!confirm('삭제할까요?')) return;
    await deleteDoc(doc(db, 'passwords', id));
    loadList();
  }

  window.viewEntry = function(id, service, uid, pw, memo) {
    realId = uid;
    realPw = pw;
    document.getElementById('v-service').textContent = service;
    document.getElementById('v-id').textContent = mask(uid);
    document.getElementById('v-pw').textContent = mask(pw);
    document.getElementById('v-memo').textContent = memo || '-';
    document.getElementById('view-modal').classList.add('show');
  }

  window.closeViewModal = function() {
    document.getElementById('view-modal').classList.remove('show');
  }
</script>
</body>
</html>
