<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#000000">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="icon" href="favicon.png" type="image/png" sizes="32x32">
  <title>JYP 비밀번호 관리</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; overscroll-behavior-y: contain; }
    body { background: #000; color: #ccc; font-family: 'Segoe UI', sans-serif; user-select: none; -webkit-user-select: none; }

    #login-screen {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; height: 100vh; gap: 12px;
    }
    #login-screen h1 { font-size: 22px; color: #888; margin-bottom: 8px; }
    .login-box { display: flex; flex-direction: column; gap: 12px; width: 240px; }
    .save-row { display: flex; justify-content: flex-end; align-items: center; gap: 6px; color: #666; font-size: 13px; }
    .save-row label { cursor: pointer; }
    .save-row input[type="checkbox"] { width: 15px; height: 15px; cursor: pointer; accent-color: #555; }
    .login-box input {
      padding: 12px 16px; border-radius: 10px; border: 1px solid #333;
      background: #111; color: #ccc; font-size: 16px; width: 100%;
      user-select: text; -webkit-user-select: text;
    }
    .login-box button {
      padding: 12px; border-radius: 10px; border: 1px solid #333;
      background: #111; color: #aaa; font-size: 16px; cursor: pointer; width: 100%;
      margin-top: 8px;
    }

    #main-screen { display: none; padding: 20px; max-width: 700px; margin: 0 auto; overflow-y: auto; height: 100vh; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .header h2 { color: #aaa; }
    .header-right { display: flex; align-items: center; gap: 12px; }
    #timer { font-size: 12px; color: #555; }
    .header button { padding: 8px 16px; border-radius: 8px; border: 1px solid #333; background: #111; color: #888; cursor: pointer; }

    .search-box {
      width: 100%; padding: 10px 16px; border-radius: 10px; border: 1px solid #333;
      background: #111; color: #ccc; font-size: 15px; margin-bottom: 14px;
      user-select: text; -webkit-user-select: text;
    }
    .search-box::placeholder { color: #444; }

    .add-btn { width: 100%; padding: 14px; border-radius: 10px; border: 1px solid #333; background: #111; color: #aaa; font-size: 16px; cursor: pointer; margin-bottom: 16px; }

    .card {
      background: #111; border-radius: 10px; padding: 14px 12px;
      margin-bottom: 10px; display: flex; justify-content: space-between;
      align-items: center; border: 1px solid #222;
      transition: opacity 0.2s; cursor: pointer;
    }
    .card:active { opacity: 0.7; }
    .card-left { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; }
    .card-info { flex: 1; min-width: 0; }
    .card-info h3 { font-size: 15px; margin-bottom: 2px; color: #ccc; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .card-info p { font-size: 12px; color: #555; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .card-actions { display: flex; gap: 6px; flex-shrink: 0; }
    .card-actions button { padding: 5px 8px; border-radius: 6px; border: none; cursor: pointer; font-size: 11px; white-space: nowrap; }
    .btn-edit { background: #2a1f00; color: #999; }
    .btn-del { background: #2a0000; color: #999; }

    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); justify-content: center; align-items: center; z-index: 100; }
    .modal.show { display: flex; }
    .modal-box { background: #111; border-radius: 14px; padding: 24px; width: 320px; display: flex; flex-direction: column; gap: 10px; border: 1px solid #222; }
    .modal-box h3 { color: #888; margin-bottom: 4px; }
    .field-label { font-size: 11px; color: #555; margin-bottom: 2px; }
    .modal-box input { padding: 10px; border-radius: 8px; border: 1px solid #333; background: #000; color: #ccc; font-size: 14px; width: 100%; user-select: text; -webkit-user-select: text; }
    .modal-box button { padding: 10px; border-radius: 8px; border: none; cursor: pointer; font-size: 14px; color: #aaa; }
    .btn-save { background: #222; }
    .btn-cancel { background: #1a1a1a; }

    .masked { font-size: 16px; margin-bottom: 4px; cursor: pointer; padding: 8px; border-radius: 8px; background: #0a0a0a; border: 1px solid #222; color: #aaa; user-select: none; -webkit-user-select: none; }
    .masked .hint { font-size: 11px; color: #444; margin-top: 4px; }

    /* 커스텀 삭제 확인 팝업 */
    #confirm-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.92); justify-content: center; align-items: center; z-index: 200; }
    #confirm-modal.show { display: flex; }
    .confirm-box { background: #111; border-radius: 16px; padding: 28px 24px; width: 280px; display: flex; flex-direction: column; align-items: center; gap: 16px; border: 1px solid #2a0000; }
    .confirm-box .confirm-icon { font-size: 36px; }
    .confirm-box p { font-size: 15px; color: #ccc; text-align: center; line-height: 1.5; }
    .confirm-box .confirm-name { color: #ff6b6b; font-size: 16px; font-weight: bold; }
    .confirm-buttons { display: flex; gap: 10px; width: 100%; }
    .confirm-buttons button { flex: 1; padding: 12px; border-radius: 10px; border: none; cursor: pointer; font-size: 14px; }
    .confirm-yes { background: #3a0000; color: #ff6b6b; }
    .confirm-no { background: #1a1a1a; color: #888; }

    /* 뒤로가기 토스트 */
    #back-toast { display: none; position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%); background: #222; color: #aaa; padding: 10px 20px; border-radius: 20px; font-size: 13px; z-index: 300; border: 1px solid #333; }
    #back-toast.show { display: block; }
  </style>
</head>
<body>

<div id="login-screen">
  <h1>🔐 비밀번호 관리</h1>
  <div class="login-box">
    <div class="save-row">
      <label for="save-id">아이디 저장</label>
      <input type="checkbox" id="save-id">
    </div>
    <input type="text" id="name-input" placeholder="아이디">
    <input type="password" id="pin-input" placeholder="비밀번호">
    <button onclick="doLogin()">로그인</button>
  </div>
</div>

<div id="main-screen">
  <div class="header">
    <h2 id="welcome-text"></h2>
    <div class="header-right">
      <span id="timer"></span>
      <button onclick="doLogout()">로그아웃</button>
    </div>
  </div>
  <input type="text" class="search-box" id="search-input" placeholder="🔍 검색">
  <button class="add-btn" onclick="openAddModal()">+ 계정 추가</button>
  <div id="list"></div>
</div>

<!-- 추가/수정 모달 -->
<div class="modal" id="modal">
  <div class="modal-box">
    <h3 id="modal-title">계정 추가</h3>
    <div class="field-label">서비스명</div>
    <input type="text" id="m-service" placeholder="예: 네이버">
    <div class="field-label">아이디</div>
    <input type="text" id="m-id" placeholder="아이디">
    <div class="field-label">비밀번호</div>
    <input type="text" id="m-pw" placeholder="비밀번호">
    <div class="field-label">메모 (선택)</div>
    <input type="text" id="m-memo" placeholder="메모">
    <button class="btn-save" onclick="saveEntry()">저장</button>
    <button class="btn-cancel" onclick="closeModal()">취소</button>
  </div>
</div>

<!-- 보기 모달 -->
<div class="modal" id="view-modal">
  <div class="modal-box">
    <h3 id="v-service"></h3>
    <div class="field-label">아이디</div>
    <div class="masked" id="v-id-wrap">
      <div id="v-id"></div>
      <div class="hint">꾹 누르면 표시</div>
    </div>
    <div class="field-label">비밀번호</div>
    <div class="masked" id="v-pw-wrap">
      <div id="v-pw"></div>
      <div class="hint">꾹 누르면 표시</div>
    </div>
    <div class="field-label">메모</div>
    <p id="v-memo" style="font-size:14px;color:#666;margin-bottom:8px"></p>
    <button class="btn-cancel" onclick="closeViewModal()">닫기</button>
  </div>
</div>

<!-- 커스텀 삭제 확인 팝업 -->
<div id="confirm-modal">
  <div class="confirm-box">
    <div class="confirm-icon">🗑️</div>
    <p>삭제하시겠어요?<br><span class="confirm-name" id="confirm-name"></span></p>
    <div class="confirm-buttons">
      <button class="confirm-no" onclick="closeConfirm()">취소</button>
      <button class="confirm-yes" onclick="confirmDelete()">삭제</button>
    </div>
  </div>
</div>

<!-- 뒤로가기 토스트 -->
<div id="back-toast">한 번 더 누르면 종료됩니다</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
  import { getFirestore, collection, doc, getDocs, addDoc, updateDoc, deleteDoc, query, where } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDWu9mmACrAqv3P-VW54DogZ61ZzraW5Yg",
    authDomain: "jyppass.firebaseapp.com",
    projectId: "jyppass",
    storageBucket: "jyppass.firebasestorage.app",
    messagingSenderId: "270444457037",
    appId: "1:270444457037:web:93a53b15668c2784188004"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  let currentUser = null;
  let editingId = null;
  let timerInterval = null;
  let realId = '';
  let realPw = '';
  let deleteTargetId = '';
  let deleteTargetName = '';
  let allDocs = [];
  const TIMEOUT = 5 * 60;

  // 뒤로가기 3번 종료
  let backCount = 0;
  let backTimer = null;
  let toastTimer = null;

  history.pushState(null, null, location.href);
  window.addEventListener('popstate', () => {
    history.pushState(null, null, location.href);

    // 모달 열려있으면 닫기
    if (document.getElementById('view-modal').classList.contains('show')) {
      closeViewModal(); return;
    }
    if (document.getElementById('modal').classList.contains('show')) {
      closeModal(); return;
    }
    if (document.getElementById('confirm-modal').classList.contains('show')) {
      closeConfirm(); return;
    }

    backCount++;
    clearTimeout(backTimer);
    clearTimeout(toastTimer);

    const toast = document.getElementById('back-toast');
    toast.classList.add('show');

    if (backCount >= 2) {
      backCount = 0;
      toast.classList.remove('show');
      window.close();
      // window.close()가 안되는 경우 앱 최소화 시도
      if (navigator.app) navigator.app.exitApp();
    } else {
      backTimer = setTimeout(() => { backCount = 0; }, 2000);
      toastTimer = setTimeout(() => { toast.classList.remove('show'); }, 2000);
    }
  });

  // 마스킹
  function mask(str) {
    if (!str) return '';
    if (str.length <= 3) return str[0] + '*'.repeat(str.length - 1);
    return str.slice(0, 2) + '*'.repeat(str.length - 3) + str.slice(-1);
  }

  function setupReveal(elId, wrapId, getRealVal) {
    const wrap = document.getElementById(wrapId);
    const el = document.getElementById(elId);
    const show = () => { el.textContent = getRealVal(); };
    const hide = () => { el.textContent = mask(getRealVal()); };
    wrap.addEventListener('mousedown', show);
    wrap.addEventListener('mouseup', hide);
    wrap.addEventListener('mouseleave', hide);
    wrap.addEventListener('touchstart', e => { e.preventDefault(); show(); }, { passive: false });
    wrap.addEventListener('touchend', hide);
    wrap.addEventListener('touchcancel', hide);
  }

  setupReveal('v-id', 'v-id-wrap', () => realId);
  setupReveal('v-pw', 'v-pw-wrap', () => realPw);

  document.addEventListener('contextmenu', e => e.preventDefault());

  // 아이디 저장
  const savedName = localStorage.getItem('savedName');
  if (savedName) {
    document.getElementById('name-input').value = savedName;
    document.getElementById('save-id').checked = true;
  }

  // 타이머
  function startTimer() {
    let remaining = TIMEOUT;
    clearInterval(timerInterval);
    timerInterval = setInterval(() => {
      remaining--;
      const m = Math.floor(remaining / 60);
      const s = remaining % 60;
      document.getElementById('timer').textContent = `${m}:${s.toString().padStart(2,'0')}`;
      if (remaining <= 0) { clearInterval(timerInterval); doLogout(); }
    }, 1000);
  }

  function resetTimer() { if (currentUser) startTimer(); }
  ['click','keydown','mousemove','touchstart'].forEach(e => document.addEventListener(e, resetTimer));

  // 검색
  document.getElementById('search-input').addEventListener('input', function() {
    const keyword = this.value.trim().toLowerCase();
    renderList(keyword);
  });

  window.doLogin = async function() {
    const name = document.getElementById('name-input').value.trim();
    const pin = document.getElementById('pin-input').value.trim();
    const saveId = document.getElementById('save-id').checked;
    if (!name || !pin) return alert('아이디와 비밀번호를 입력하세요');
    const snap = await getDocs(query(collection(db, 'users'), where('name', '==', name)));
    if (snap.empty) return alert('사용자 없음');
    const userDoc = snap.docs[0];
    const user = userDoc.data();
    if (user.pin !== pin) return alert('비밀번호 오류');
    if (saveId) localStorage.setItem('savedName', name);
    else localStorage.removeItem('savedName');
    currentUser = { id: userDoc.id, ...user };
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('main-screen').style.display = 'block';
    document.getElementById('welcome-text').textContent = name + '님';
    document.getElementById('pin-input').value = '';
    startTimer();
    loadList();
  }

  window.doLogout = function() {
    currentUser = null;
    clearInterval(timerInterval);
    document.getElementById('timer').textContent = '';
    document.getElementById('login-screen').style.display = 'flex';
    document.getElementById('main-screen').style.display = 'none';
    document.getElementById('pin-input').value = '';
    document.getElementById('search-input').value = '';
  }

  async function loadList() {
    const q = query(collection(db, 'passwords'), where('uid', '==', currentUser.id));
    const snap = await getDocs(q);
    allDocs = snap.docs.map(d => ({ docId: d.id, ...d.data() }));
    renderList('');
  }

  function renderList(keyword) {
    const listEl = document.getElementById('list');
    listEl.innerHTML = '';
    const filtered = keyword
      ? allDocs.filter(d => d.service.toLowerCase().includes(keyword) || (d.id && d.id.toLowerCase().includes(keyword)))
      : allDocs;

    if (filtered.length === 0) {
      listEl.innerHTML = '<p style="color:#444;text-align:center;margin-top:40px;">검색 결과 없음</p>';
      return;
    }

    filtered.forEach(data => {
      const card = document.createElement('div');
      card.className = 'card';
      card.setAttribute('data-id', data.docId);
      card.innerHTML = `
        <div class="card-left">
          <div class="card-info">
            <h3>${data.service}</h3>
            <p>${data.id}</p>
          </div>
        </div>
        <div class="card-actions">
          <button class="btn-edit" onclick="event.stopPropagation();openEditModal('${data.docId}','${data.service}','${data.id}','${data.pw}','${data.memo||''}')">수정</button>
          <button class="btn-del" onclick="event.stopPropagation();openConfirm('${data.docId}','${data.service}')">삭제</button>
        </div>
      `;
      card.addEventListener('click', () => {
        viewEntry(data.docId, data.service, data.id, data.pw, data.memo || '');
      });
      listEl.appendChild(card);
    });
  }

  window.openAddModal = function() {
    editingId = null;
    document.getElementById('modal-title').textContent = '계정 추가';
    document.getElementById('m-service').value = '';
    document.getElementById('m-id').value = '';
    document.getElementById('m-pw').value = '';
    document.getElementById('m-memo').value = '';
    document.getElementById('modal').classList.add('show');
  }

  window.openEditModal = function(docId, service, id, pw, memo) {
    editingId = docId;
    document.getElementById('modal-title').textContent = '계정 수정';
    document.getElementById('m-service').value = service;
    document.getElementById('m-id').value = id;
    document.getElementById('m-pw').value = pw;
    document.getElementById('m-memo').value = memo;
    document.getElementById('modal').classList.add('show');
  }

  window.closeModal = function() {
    document.getElementById('modal').classList.remove('show');
  }

  window.saveEntry = async function() {
    const service = document.getElementById('m-service').value.trim();
    const id = document.getElementById('m-id').value.trim();
    const pw = document.getElementById('m-pw').value.trim();
    const memo = document.getElementById('m-memo').value.trim();
    if (!service || !id || !pw) return alert('서비스명, 아이디, 비밀번호는 필수입니다');
    if (editingId) {
      await updateDoc(doc(db, 'passwords', editingId), { service, id, pw, memo });
    } else {
      await addDoc(collection(db, 'passwords'), { uid: currentUser.id, service, id, pw, memo });
    }
    closeModal();
    loadList();
  }

  // 커스텀 삭제 확인
  window.openConfirm = function(docId, name) {
    deleteTargetId = docId;
    deleteTargetName = name;
    document.getElementById('confirm-name').textContent = name;
    document.getElementById('confirm-modal').classList.add('show');
  }

  window.closeConfirm = function() {
    document.getElementById('confirm-modal').classList.remove('show');
  }

  window.confirmDelete = async function() {
    await deleteDoc(doc(db, 'passwords', deleteTargetId));
    closeConfirm();
    loadList();
  }

  window.viewEntry = function(docId, service, id, pw, memo) {
    realId = id; realPw = pw;
    document.getElementById('v-service').textContent = service;
    document.getElementById('v-id').textContent = mask(id);
    document.getElementById('v-pw').textContent = mask(pw);
    document.getElementById('v-memo').textContent = memo || '-';
    document.getElementById('view-modal').classList.add('show');
  }

  window.closeViewModal = function() {
    document.getElementById('view-modal').classList.remove('show');
  }
</script>
</body>
</html>
